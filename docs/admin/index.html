<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SMCS Schedule Admin</title>
	<link rel="icon" type="image/png" href="../logo.png">
	<link rel="stylesheet" href="../styles.css">
</head>
<body class="admin-page" data-page="admin">
	<div class="site-shell">
		<section id="loginPanel" class="surface auth-card">
			<p class="eyebrow">Admin Access</p>
			<h2>Sign in to edit the schedule</h2>
			<form id="adminLoginForm" class="auth-form">
				<label class="field">
					<span>Username</span>
					<input id="adminUsername" type="text" autocomplete="username" required>
				</label>
				<label class="field">
					<span>Password</span>
					<input id="adminPassword" type="password" autocomplete="current-password" required>
				</label>
				<button class="primary-btn" type="submit">Unlock Editor</button>
				<p id="loginError" class="error-text" hidden style="color: var(--danger); font-size: 0.8rem; margin-top: 8px;"></p>
				<div class="auth-footer" style="text-align: center; margin-top: 16px;">
					<a href="../" class="ghost-btn">← Back to Schedule</a>
				</div>
			</form>
		</section>

		<section id="adminApp" class="admin-layout" hidden>
			<header class="hero surface">
				<div class="hero-copy">
					<p class="eyebrow">SMCS Schedule Admin</p>
					<h1>Schedule Editor</h1>
					<p class="lede">Drag classes from the panel and drop them into the schedule. Click room numbers to edit.</p>
				</div>
				<div class="hero-actions">
					<a class="secondary-btn" href="../"><span class="btn-icon">👁</span> Public View</a>
					<div class="settings-wrapper">
						<button id="settingsButton" class="secondary-btn" type="button"><span class="btn-icon">⚙</span> Settings</button>
						<div id="settingsMenu" class="settings-menu hidden">
							<button id="darkModeToggle" class="settings-item" type="button">Dark Mode</button>
							<button id="lightModeToggle" class="settings-item" type="button">Light Mode</button>
							<button id="redModeToggle" class="settings-item" type="button">Red Mode</button>
						</div>
					</div>
					<button id="logoutButton" class="ghost-btn" type="button"><span class="btn-icon">🚪</span> Logout</button>
				</div>
			</header>

			<div class="surface toolbar-panel">
				<div class="toolbar-section">
					<div class="view-toggle">
						<button id="adminDayViewBtn" class="toggle-btn active">Day Editor</button>
						<button id="adminWeekViewBtn" class="toggle-btn">Week Editor</button>
					</div>
					<div class="admin-nav-group">
						<select id="adminDaySelect" class="secondary-btn">
							<option value="MON">Monday</option>
							<option value="TUE">Tuesday</option>
							<option value="WED">Wednesday</option>
							<option value="THU">Thursday</option>
							<option value="FRI">Friday</option>
						</select>
					</div>
				</div>

				<div class="toolbar-section">
					<div class="button-group">
						<button id="undoButton" class="secondary-btn" type="button" title="Undo Last Action">
							<span class="btn-icon">↩</span> Undo
						</button>
						<button id="lockDayButton" class="secondary-btn" type="button">
							<span class="btn-icon">🔓</span> Lock Day
						</button>
					<button id="autofillDayButton" class="secondary-btn" type="button" title="Autofill current day with matching blocks">
						<span class="btn-icon">✨</span> Day
					</button>
					<button id="autofillWeekButton" class="secondary-btn" type="button" title="Autofill entire week with matching blocks">
						<span class="btn-icon">✨</span> Week
					</button>
					</div>
				</div>

				<div class="toolbar-section">
					<button id="exportButton" class="secondary-btn" type="button"><span class="btn-icon">💾</span> Export JSON</button>
					<button id="clearAllButton" class="danger-btn" type="button"><span class="btn-icon">🗑</span> Clear Day</button>
					<div class="status-indicator">
						<div class="status-dot"></div>
						<span id="saveStatus" class="save-status">Synced</span>
					</div>
				</div>
			</div>

			<div class="admin-grid-2">
				<section class="surface editor-panel">
					<p class="eyebrow">Active View</p>
					<h2>Schedule Layout</h2>
					<div id="adminSchedule" class="period-editor-list" style="margin-top: 24px;"></div>
				</section>

				<aside class="sidebar-stack">
					<section class="surface info-card">
						<p class="eyebrow">Library</p>
						<h2>Drag to assign</h2>
						<div id="adminClassCards" class="class-cards-panel" style="margin-top: 16px;"></div>
					</section>
				</aside>
			</div>

			<section class="surface info-card" style="margin-top: 24px;">
				<div class="panel-head" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
					<div>
						<p class="eyebrow">Events</p>
						<h2>Manage Bulletin</h2>
					</div>
					<button id="addEventButton" class="primary-btn" type="button"><span class="btn-icon">➕</span> Add Event</button>
				</div>
				<div id="eventsEditor" class="event-editor-list"></div>
			</section>
		</section>
	</div>

	<!-- Firebase SDKs -->
	<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


	<script src="../app.js"></script>
</body>
</html>
