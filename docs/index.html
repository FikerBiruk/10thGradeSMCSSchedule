<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SMCS Schedule</title>
	<link rel="icon" type="image/png" href="logo.png">
	<link rel="stylesheet" href="styles.css">
</head>
<body class="public-page" data-page="public">
	<div class="site-shell">
		<section class="public-grid">
			<main class="surface main-panel">
				<div id="publicSchedule" class="period-board"></div>
			</main>

			<aside class="sidebar-stack">
				<section class="surface info-card">
					<div class="sidebar-header-box">
						<p class="eyebrow">SMCS Schedule</p>
						<h1>Block Schedule</h1>
						<p class="lede">View the current block schedule and upcoming school events.</p>
						<div class="sidebar-actions">
							<div class="view-toggle">
								<button id="weekViewBtn" class="toggle-btn active">Week</button>
								<button id="dayViewBtn" class="toggle-btn">Day</button>
							</div>
							<button id="settingsButton" class="secondary-btn" type="button">Settings</button>
							<div id="settingsMenu" class="settings-menu hidden">
								<button id="darkModeToggle" class="settings-item" type="button">Dark Mode</button>
								<button id="lightModeToggle" class="settings-item" type="button">Light Mode</button>
								<button id="redModeToggle" class="settings-item" type="button">Red Mode</button>
								<hr class="settings-divider">
								<a href="admin/" class="settings-item settings-link">Admin Editor</a>
							</div>
						</div>
					</div>
				</section>

				<section class="surface info-card">
					<p class="eyebrow">Special Events</p>
					<h2>This Week</h2>
					<div id="publicEvents" class="event-feed"></div>
				</section>

				<section class="surface info-card">
					<p class="eyebrow">Credit</p>
					<h2 class="credit-heading">Made By: <span class="faan-credit" title="Fiker, Aeshan, Ayan, Natan">FAAN</span></h2>
				</section>
			</aside>
		</section>
	</div>

	<!-- Firebase SDKs -->
	<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
	<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

	<!-- Trash zone (admin only) -->
	<div id="trashZone" title="Drop here to delete" aria-hidden="true" class="hidden">🗑️ Trash</div>

	<script src="app.js"></script>
</body>
</html>
