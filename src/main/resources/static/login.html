<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SMCS Schedule Login</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
	<main class="auth-shell">
		<section class="auth-card">
			<p class="eyebrow">SMCS Schedule</p>
			<h1>Admin Login</h1>
			<p class="lede">Use the hardcoded admin account to manage the schedule.</p>

			<form id="loginForm" class="stack-form">
				<label>
					<span>Username</span>
					<input id="username" name="username" type="text" autocomplete="username" required>
				</label>
				<label>
					<span>Password</span>
					<input id="password" name="password" type="password" autocomplete="current-password" required>
				</label>
				<button type="submit" class="primary-btn">Sign in</button>
				<p id="loginError" class="error-text" hidden></p>
			</form>
		</section>
	</main>

	<script src="app.js"></script>
</body>
</html>
